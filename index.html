<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новорічні Передбачення</title>
    <!-- Підключення Tailwind CSS для стилізації -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Підключення html2canvas для збереження картки як картинки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Підключення красивого шрифту -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            /* Святковий зимовий фон */
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);
            background-attachment: fixed;
            color: white;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Pacifico', cursive;
        }

        /* Анімація снігу на фоні */
        .snow {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(4px 4px at 100px 50px, #fff, transparent),
                radial-gradient(6px 6px at 200px 150px, #fff, transparent),
                radial-gradient(3px 3px at 300px 250px, #fff, transparent),
                radial-gradient(5px 5px at 400px 350px, #fff, transparent),
                radial-gradient(4px 4px at 500px 100px, #fff, transparent),
                radial-gradient(6px 6px at 50px 200px, #fff, transparent),
                radial-gradient(3px 3px at 150px 300px, #fff, transparent),
                radial-gradient(5px 5px at 250px 400px, #fff, transparent),
                radial-gradient(4px 4px at 350px 500px, #fff, transparent);
            background-size: 600px 600px;
            animation: snow-anim 15s linear infinite;
        }
        @keyframes snow-anim {
            0% { background-position: 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px; }
            100% { background-position: 600px 600px, 400px 600px, 300px 600px, 200px 600px, 500px 600px, 100px 600px, 250px 600px, 150px 600px, 350px 600px; }
        }

        /* Анімація появи картки */
        .card-enter {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5) translateY(50px) rotate(-10deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0); }
        }

        /* Кнопки */
        .btn-magic {
            background: linear-gradient(45deg, #ef4444, #f97316);
            transition: all 0.3s ease;
        }
        .btn-magic:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5);
        }
        .btn-magic:active {
            transform: translateY(1px);
        }

        /* Тост-повідомлення */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative p-4">

    <!-- Ефект снігу -->
    <div class="snow"></div>

    <div class="relative z-10 w-full max-w-2xl mx-auto flex flex-col items-center text-center space-y-8">
        
        <!-- Заголовок -->
        <div class="space-y-2">
            <h1 class="title-font text-5xl md:text-7xl text-yellow-300 drop-shadow-lg tracking-wide">
                Новорічні
            </h1>
            <h2 class="title-font text-4xl md:text-6xl text-white drop-shadow-md">
                передбачення
            </h2>
        </div>

        <!-- Контейнер картки з побажанням -->
        <div id="card-container" class="w-full px-4" style="display: none;">
            <!-- Саме цю картку ми будемо конвертувати в картинку (Стиль як на картинках) -->
            <div id="capture-card" class="bg-white relative rounded-3xl shadow-2xl p-2 mx-auto w-full max-w-sm transition-all duration-300">
                <!-- Внутрішня пунктирна рамка -->
                <div id="text-wish-container" class="border-[3px] border-dashed border-blue-400 rounded-2xl h-full p-8 flex flex-col items-center justify-center relative overflow-hidden min-h-[350px] bg-gradient-to-b from-white via-white to-blue-100">
                    
                    <!-- Декоративні елементи по кутках -->
                    <div class="absolute top-3 left-3 text-blue-300 text-2xl opacity-70">❄️</div>
                    <div class="absolute top-4 right-4 text-yellow-400 text-2xl opacity-90">⭐</div>
                    <div class="absolute bottom-4 left-3 text-green-700 text-3xl opacity-80" style="transform: scaleX(-1) rotate(15deg);">🌿</div>
                    <div class="absolute bottom-3 right-4 text-blue-300 text-2xl opacity-70">❄️</div>
                    <div class="absolute top-1/2 left-2 text-yellow-400 text-lg opacity-60">✨</div>
                    <div class="absolute bottom-1/3 right-2 text-yellow-400 text-xl opacity-70">⭐</div>

                    <!-- Іконка передбачення -->
                    <div id="wish-icon" class="text-7xl mb-6 z-10 drop-shadow-md transform transition-transform hover:scale-110">
                        🎁
                    </div>
                    
                    <!-- Текст передбачення -->
                    <p id="wish-text" class="text-2xl md:text-[28px] text-red-800 font-extrabold text-center leading-tight z-10 font-['Nunito'] drop-shadow-sm">
                        <!-- Сюди потрапить текст -->
                    </p>
                </div>
                
                <!-- Контейнер для побажань-картинок -->
                <div id="image-wish-container" class="w-full h-full flex items-center justify-center rounded-2xl overflow-hidden bg-white" style="display: none;">
                    <img id="wish-image" crossorigin="anonymous" class="w-full h-auto rounded-2xl object-cover" src="" alt="Передбачення" />
                </div>
            </div>
        </div>

        <!-- Початкова іконка (до кліку) -->
        <div id="start-icon" class="text-9xl animate-bounce cursor-pointer drop-shadow-2xl transition-transform hover:scale-110" onclick="generateWish()">
            🎁
        </div>

        <!-- Головна кнопка -->
        <button id="main-btn" onclick="generateWish()" class="btn-magic text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-full shadow-lg border-2 border-yellow-300">
            Отримати передбачення
        </button>

        <!-- Кнопки дій (Зберегти / Поділитися) -->
        <div id="action-buttons" class="hidden flex-row gap-4 mt-6">
            <button onclick="saveImage()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white py-3 px-6 rounded-full font-bold transition shadow-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Зберегти
            </button>
            <button onclick="copyText()" class="flex items-center gap-2 bg-purple-600 hover:bg-purple-500 text-white py-3 px-6 rounded-full font-bold transition shadow-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Копіювати
            </button>
        </div>

    </div>

    <!-- Повідомлення (Тост) -->
    <div id="toast">Повідомлення</div>

    <script>
        // Колекція передбачень з відповідними іконками (як на ваших картинках)
        const predictions = [
            { type: "image", url: "https://i.postimg.cc/RCGHV5Zf/Znimok-ekrana-2026-11-18-o-16-14-32.png" },
            { type: "image", url: "https://i.postimg.cc/PJFJbHC0/Znimok-ekrana-2026-11-18-o-16-14-40.png" },
            { type: "image", url: "https://i.postimg.cc/XJjYTqd0/Znimok-ekrana-2026-11-18-o-16-16-07.png" },
            { type: "image", url: "https://i.postimg.cc/rmfwcTCn/Znimok-ekrana-2026-11-18-o-16-15-59.png" },
            { type: "image", url: "https://i.postimg.cc/B6SndbH9/Znimok-ekrana-2026-11-18-o-16-15-52.png" },
            { type: "image", url: "https://i.postimg.cc/NMsjWFmh/Znimok-ekrana-2026-11-18-o-16-15-37.png" },
            { type: "image", url: "https://i.postimg.cc/hjDtHvxH/Znimok-ekrana-2026-11-18-o-16-15-31.png" },
            { type: "image", url: "https://i.postimg.cc/9MmQv0Ts/Znimok-ekrana-2026-11-18-o-16-15-24.png" },
            { type: "image", url: "https://i.postimg.cc/85pzqcWt/Znimok-ekrana-2026-11-18-o-16-15-16.png" },
            { type: "image", url: "https://i.postimg.cc/XJjYTqFx/Znimok-ekrana-2026-11-18-o-16-15-08.png" },
            { type: "image", url: "https://i.postimg.cc/pTWLgr8s/Znimok-ekrana-2026-11-18-o-16-14-58.png" },
            { type: "image", url: "https://i.postimg.cc/fLzR6yXC/Znimok-ekrana-2026-11-18-o-16-14-48.png" },
            { type: "image", url: "https://i.postimg.cc/qvHh1kmG/Znimok-ekrana-2026-11-18-o-16-28-52.png" },
            { type: "image", url: "https://i.postimg.cc/Dw3Jx2C6/Znimok-ekrana-2026-11-18-o-16-28-31.png" },
            { type: "image", url: "https://i.postimg.cc/MpJM9Wst/Znimok-ekrana-2026-11-18-o-16-28-19.png" },
            { type: "image", url: "https://i.postimg.cc/3xQ4tKLB/Znimok-ekrana-2026-11-18-o-16-27-51.png" }
        ];

        let currentWish = "";

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function generateWish() {
            // Ховаємо стартову іконку
            document.getElementById('start-icon').style.display = 'none';
            
            const cardContainer = document.getElementById('card-container');
            const captureCard = document.getElementById('capture-card');
            
            const textContainer = document.getElementById('text-wish-container');
            const imageContainer = document.getElementById('image-wish-container');
            const wishTextElement = document.getElementById('wish-text');
            const wishIconElement = document.getElementById('wish-icon');
            const wishImageElement = document.getElementById('wish-image');
            
            const actionButtons = document.getElementById('action-buttons');
            const mainBtn = document.getElementById('main-btn');

            // Випадковий вибір
            const randomIndex = Math.floor(Math.random() * predictions.length);
            const wishData = predictions[randomIndex];

            // Анімація скидання
            captureCard.classList.remove('card-enter');
            // Примусовий reflow для повторної анімації
            void captureCard.offsetWidth;
            
            // Встановлюємо контент залежно від типу (текст чи картинка)
            if (wishData.type === 'image') {
                currentWish = "Щасливого Нового Року та веселих свят! 🎄✨"; // Дефолтний текст для копіювання
                wishImageElement.src = wishData.url;
                textContainer.style.display = 'none';
                imageContainer.style.display = 'flex';
            } else {
                currentWish = wishData.text; // Зберігаємо текст для копіювання
                wishTextElement.innerText = wishData.text;
                wishIconElement.innerText = wishData.icon;
                textContainer.style.display = 'flex';
                imageContainer.style.display = 'none';
            }
            
            cardContainer.style.display = 'block';
            captureCard.classList.add('card-enter');
            
            // Змінюємо текст кнопки
            mainBtn.innerText = "Отримати ще одне!";
            
            // Показуємо кнопки дій
            actionButtons.classList.remove('hidden');
            actionButtons.classList.add('flex');
        }

        function saveImage() {
            showToast("Генеруємо зображення...");
            const card = document.getElementById('capture-card');
            
            // Використовуємо html2canvas для створення скріншоту картки
            html2canvas(card, {
                scale: 2, // Висока якість
                backgroundColor: null, // Прозорий фон поза карткою
                useCORS: true, // Дозволяє завантажувати картинки з інших доменів
                allowTaint: true
            }).then(canvas => {
                // Створюємо посилання для завантаження
                const link = document.createElement('a');
                link.download = 'Moe_Peredbachennya_2024.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast("Зображення успішно збережено!");
            }).catch(err => {
                console.error("Помилка збереження:", err);
                showToast("Не вдалося зберегти зображення.");
            });
        }

        function copyText() {
            const textToCopy = `🎄 Моє новорічне передбачення: "${currentWish}" ✨`;
            
            // Сучасний підхід
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast("Текст скопійовано!");
                }).catch(() => {
                    fallbackCopyText(textToCopy);
                });
            } else {
                // Запасний варіант
                fallbackCopyText(textToCopy);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("Текст скопійовано!");
            } catch (err) {
                showToast("Помилка копіювання.");
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
